<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0d26">
<title>SSCPC Admin</title>
<link rel="icon" href="../images/crown-mark.png">
<link rel="stylesheet" href="../css/style.css">
<style>
@font-face{font-family:'Nexa';font-weight:100 900;font-style:normal;font-display:swap;src:url(../fonts/Nexa-Heavy.ttf) format('truetype')}
@font-face{font-family:'Sparling';font-weight:100 900;font-style:normal;font-display:swap;src:url(../fonts/sparling-demo.ttf) format('truetype')}
@font-face{font-family:'Roboto';font-weight:400;font-style:normal;font-display:swap;src:url(../fonts/roboto-regular.ttf) format('truetype')}
@font-face{font-family:'Roboto';font-weight:600 900;font-style:normal;font-display:swap;src:url(../fonts/roboto-bold.ttf) format('truetype')}
:root{--body:'Nexa','Roboto','Noto Sans Sinhala','Iskoola Pota','Nirmala UI',Arial,sans-serif;--heading:'Sparling','Nexa','Roboto','Noto Sans Sinhala','Iskoola Pota','Nirmala UI',Arial,sans-serif}
h1,h2,h3,h4,.ttl,legend,.brand{font-family:var(--heading)}
body,input,select,textarea,button,td,th,label,summary{font-family:var(--body);font-weight:700}
</style>
<style>
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;color:#f4f1e4;background:radial-gradient(55% 55% at 78% 18%,rgba(125,21,38,.6),transparent 70%),radial-gradient(50% 60% at 8% 95%,rgba(29,38,96,.95),transparent 70%),#080b22}
#login .vf{width:min(24rem,100%);text-align:center}
#login img{width:54px;margin-bottom:.8rem}
.ttl{font-family:var(--heading);font-size:1.6rem;line-height:1.2;margin-bottom:1rem}
.in{width:100%;padding:.7rem .85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);font:inherit;font-size:.85rem;border-radius:0}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
#login .in{background:#080b22;color:#f4f1e4;border-color:rgba(244,241,228,.28);margin:1rem 0}
.app{display:grid;grid-template-columns:14rem 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.2rem}
.side .brand{padding:0 .5rem 1rem;font-family:var(--heading)}
.side .brand img{width:30px}
.tab{text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:.6rem .8rem;font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab:hover{color:var(--accent)}
.tab[aria-selected=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sp{flex:1}
.badge{margin:.5rem;padding:.4rem .6rem;background:var(--accent);color:var(--on-accent);font-size:.65rem;font-weight:700;letter-spacing:.06em;text-align:center}
main{padding:clamp(1rem,3vw,2rem);min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem;margin-bottom:1.2rem}
.stats .card{padding:1rem}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.bar .in{flex:1;min-width:10rem}
.sm{padding:.55rem 1.2rem!important;font-size:.68rem!important}
.tbl{overflow:auto;max-height:65vh;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.75rem}
th,td{padding:.55rem .7rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:16rem;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--surface);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.it{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);margin:.5rem 0}
details.it summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;display:flex;gap:.4rem;align-items:center}
details.it summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{padding:.2rem 1rem 1rem;display:grid;gap:.7rem}
label.f{display:grid;gap:.25rem;font-size:.66rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}
fieldset{border:1px solid var(--line);padding:.8rem;display:grid;gap:.7rem;min-width:0}
legend{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 .4rem}
.mini{background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:.1rem .5rem;font-size:.75rem}
.mini:hover{border-color:var(--accent)}
.note{color:var(--muted);font-size:.78rem;margin-bottom:1rem;max-width:44rem}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:.5rem;align-items:center}.side .brand,.sp{display:none}.tab{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.tab[aria-selected=true]{border-color:var(--accent)}}
.f,label.f,div.f{display:grid;gap:.25rem;font-size:.66rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}
.err{border-color:#c0392b!important;color:#ff8a8a}pre.box{white-space:pre-wrap;font:.72rem/1.6 var(--mono);padding:1rem;background:var(--surface);border:1px solid var(--line);max-height:50vh;overflow:auto}
div.box{padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);margin-bottom:.8rem;font-size:.78rem}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:min(36rem,94vw);max-height:90vh;overflow:auto;padding:1.2rem}dialog::backdrop{background:rgba(0,0,0,.65)}
.kv{margin-bottom:.6rem}.kv small{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.62rem;display:block}
.tab:disabled{opacity:.35;cursor:default}
.sitetab{max-width:60rem}
.sjump{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem 0;margin-bottom:.6rem;background:var(--bg);border-bottom:1px solid var(--line)}
.sx{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);padding:1rem 1.1rem 1.2rem;margin:1rem 0;scroll-margin-top:3.6rem}
.sx h3{font-size:1.15rem;margin-bottom:.2rem}.sx>.note{margin-bottom:.9rem}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem 1rem}
.sf{display:grid;gap:.3rem;align-content:start;min-width:0}.sf.wide{grid-column:1/-1}
.sfh{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.sfh .mini{text-transform:none;letter-spacing:0;font-size:.66rem;text-decoration:none;color:var(--ink)}
.hp{color:var(--muted);font-size:.72rem;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.sw{display:flex;align-items:center;gap:.7rem;cursor:pointer;font-size:.85rem;font-weight:600}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-t{flex:none;width:2.6rem;height:1.45rem;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:.17rem;left:.18rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw input:checked+.sw-t{background:var(--accent)}.sw input:checked+.sw-t::after{transform:translateX(1.12rem);background:var(--on-accent)}
.sw input:focus-visible+.sw-t{outline:3px solid var(--accent);outline-offset:2px}
.site-prev{margin-top:.9rem}.spb{display:inline-flex;flex-wrap:wrap;gap:.4rem .9rem;justify-content:center;padding:.55rem 1rem;background:var(--accent);color:var(--on-accent);font-size:.78rem;font-weight:700;width:100%}
.sx .box{margin:.9rem 0 .4rem}.sx details.it{margin-top:1rem}
.sx code{font-size:.72rem}
details.it summary img{flex:none}
</style>
</head>
<body>

<div id="login">
  <div class="vf"><i></i><i></i><i></i><i></i>
    <img src="../images/crown-mark.png" alt="">
    <div class="ttl">SSCPC Admin</div>
    <form id="lf"><input class="in" id="key" type="password" placeholder="Admin key" autocomplete="current-password" required>
    <button class="btn" style="width:100%">Sign in</button></form>
    <p id="msg" style="margin-top:1rem;font-size:.78rem;color:#d9dbee"></p>
  </div>
</div>

<div class="app hide" id="app">
  <nav class="side" id="side">
    <div class="brand"><img src="../images/crown-mark.png" alt=""> Admin</div>
    <div class="sp"></div>
    <div class="badge hide" id="dirty">UNPUBLISHED CHANGES</div>
    <button class="tab" id="undo" type="button" disabled>↶ Undo</button><button class="tab" id="redo" type="button" disabled>↷ Redo</button>
    <button class="tab" id="th">Light / Dark</button>
    <a class="tab" href="../tools/album-builder.html">Album Builder</a>
    <a class="tab" href="../index.html">← View site</a>
    <button class="tab" id="so">Sign out</button>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const btn=(t,f,c)=>{const b=h('button','btn '+(c||'')+' sm',t);b.type='button';b.onclick=f;return b};
const save=(n,t,ty)=>{const a=h('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
const nice=k=>k.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().replace(/^./,c=>c.toUpperCase());
const NAMES=t=>[...t.matchAll(/^const (\w+) =/gm)].map(m=>m[1]);
const parse=t=>new Function(t+';return {'+NAMES(t).join(',')+'}')();
const ser=d=>'/* SSCPC site data. Written by the admin portal (admin/index.html). Notes: README.txt */\n\n'+Object.keys(d).map(k=>`const ${k} = ${JSON.stringify(d[k],null,2)};`).join('\n\n')+'\n';
let D,B,KEYS,key='',X=null,sub='registrations',tab='home',flt='All',hist=[],hi=0,GH=JSON.parse(localStorage.gh||'{}');
const ST={},URLS={},SEC={MEMBERS:'members',SLIDES:'announcements',EVENTS:'events',LEARN:'learn',SELECTION_DONE:'spectrum',SPECTRUM_PHOTOS:'spectrum-photos'};
/* blank item shapes for lists that can start empty (used by the + Add button) */
const PHL={photo:'Photo',title:'Photo name',photographer:'Photographer name',school:'School'};
const TPL={SPECTRUM_PHOTOS:{photo:'',title:'',photographer:'',school:''},photos:{photo:'',caption:''},LEARN:{title:'',summary:'',facts:[],tryIt:'',photos:[]}};
const snapK=()=>Object.fromEntries(KEYS.map(k=>[k,JSON.stringify(D[k])]));
const changed=()=>KEYS.filter(k=>JSON.stringify(D[k])!==B[k]);
const lab=x=>x&&typeof x==='object'?((x.name||x.title||x.alt||x.image||'')+('photographer' in x?(x.photographer?' · '+x.photographer:'')+(x.school?'':' · ⚠ school missing'):'')):'';
/* ---------- undo + unpublished marker ---------- */
let ht;const ub=()=>{$('#undo').disabled=hi<1;$('#redo').disabled=hi>=hist.length-1};
function snap(){const s=JSON.stringify(D);if(s===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(s);hi=hist.length-1;if(hist.length>60){hist.shift();hi--}ub()}
function dirty(){const n=changed().length+Object.keys(ST).length;$('#dirty').classList.toggle('hide',!n);clearTimeout(ht);ht=setTimeout(snap,500);ub()}
function jump(d){clearTimeout(ht);snap();const n=hi+d;if(n<0||n>=hist.length)return;hi=n;D=JSON.parse(hist[hi]);dirty();show(tab)}
/* ---------- typed editor ---------- */
const field=(l,el)=>{const x=h('label','f');x.append(l,el);return x};
const URLK=k=>/^(link|facebook|originals|url)$|(Link|Url|_LINK)$/.test(k),IMGK=/^(image|photo|portrait|logo|poster)$/i,SELK={status:['upcoming','past'],category:['main','school']};
async function shrink(f,png,max){const im=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,png?'image/png':'image/jpeg',.84))}
function imgf(p,k,L,sec,v){
  const w=h('div','f'),pv=h('img'),i=h('input','in'),f=h('input');w.append(L);
  pv.style.cssText='max-height:5.5rem;max-width:100%;object-fit:contain;justify-self:start;background:#0003';pv.onerror=()=>pv.style.display='none';pv.onload=()=>pv.style.display='';
  const sh=()=>{pv.src=v?(URLS[v]||'../'+v):''};sh();i.value=v;i.oninput=()=>{p[k]=v=i.value;sh();dirty()};
  f.type='file';f.accept='image/*';f.onchange=async()=>{const fl=f.files[0];if(!fl)return;const png=/portrait/i.test(k)||fl.type==='image/png',b=await shrink(fl,png,png?1200:1600),
    nm=(p.name||p.title||p.alt||'img').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'img',path='images/'+(SEC[sec]||'uploads')+'/'+nm+'-'+Date.now().toString(36)+(png?'.png':'.jpg');
    ST[path]=b;URLS[path]=URL.createObjectURL(b);p[k]=v=path;i.value=path;sh();dirty()};
  w.append(pv,i,f);return w}
function ed(p,k,label,sec){
  sec=sec||k;const v=p[k],L=sec==='SPECTRUM_PHOTOS'&&PHL[k]||nice(label||k);
  if(Array.isArray(v)&&k!=='photos'&&v.every(x=>typeof x==='string')){const t=h('textarea','in');t.rows=Math.min(8,v.length+1);t.value=v.join('\n');t.oninput=()=>{p[k]=t.value.split('\n').map(s=>s.trim()).filter(Boolean);dirty()};return field(L+' (one per line)',t)}
  if(Array.isArray(v))return list(v,label,sec);
  if(v&&typeof v==='object'){const f=h('fieldset');f.append(h('legend',0,esc(L)));Object.keys(v).forEach(x=>f.append(ed(v,x,x,sec)));return f}
  if(typeof v==='boolean'){const c=h('input');c.type='checkbox';c.checked=v;c.onchange=()=>{p[k]=c.checked;dirty()};return field(c,L)}
  if(IMGK.test(k)&&typeof v==='string')return imgf(p,k,L,sec,v);
  let i;
  if(SELK[k]){i=h('select','in');[...new Set([...SELK[k],v])].forEach(o=>i.append(new Option(o,o)));i.value=v;i.onchange=()=>{p[k]=i.value;dirty()};return field(L,i)}
  if(/^(start|end)$/.test(k)){i=h('input','in');i.type='datetime-local';i.value=String(v).slice(0,16);i.onchange=()=>{p[k]=i.value?i.value+':00+05:30':'';dirty()};return field(L+' (Sri Lanka time)',i)}
  const long=typeof v==='string'&&(v.length>70||v.includes('\n')||/^(text|about|note)$/.test(k));
  i=h(long?'textarea':'input','in');if(long)i.rows=4;if(typeof v==='number')i.type='number';else if(URLK(k))i.type='text',i.placeholder='https://…';else if(k==='phone')i.type='tel';
  i.value=v;i.oninput=()=>{p[k]=typeof v==='number'?+i.value:i.value;dirty()};return field(L+(/^(name|title|image)$/.test(k)?' *':''),i)}
function list(a,label,sec){
  const box=h('div');let dr=-1;
  const draw=()=>{box.innerHTML='';
    a.forEach((it,i)=>{const d=h('details','it'),s=h('summary');s.draggable=true;s.title='Drag to reorder';s.append(h('span',0,'⠿ '+esc(lab(it)||'#'+(i+1))));
      [['↑',-1],['↓',1],['✕',0]].forEach(([t,dx])=>{const b=h('button','mini',t);b.type='button';b.onclick=e=>{e.preventDefault();
        if(!dx){if(!confirm('Remove this item?'))return;a.splice(i,1)}else{const j=i+dx;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}dirty();draw()};s.append(b)});
      s.ondragstart=e=>{dr=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x')};
      d.ondragover=e=>{if(dr>-1)e.preventDefault()};d.ondrop=e=>{e.preventDefault();e.stopPropagation();if(dr<0||dr===i)return;const[x]=a.splice(dr,1);a.splice(i,0,x);dr=-1;dirty();draw()};
      const bd=h('div','bd');Object.keys(it).forEach(k=>bd.append(ed(it,k,k,sec)));d.append(s,bd);box.append(d)});
    if(a.length||label||sec==='LEARN')box.append(btn('+ Add',()=>{const n=blank(a[0]||TPL[label]||TPL[sec]||{});label==='members'||sec==='LEARN'?a.push(n):a.unshift(n);dirty();draw()},'ghost'));
    if(label==='photos'){const u=h('input','in');u.type='file';u.accept='image/*';u.multiple=true;
      u.onchange=async()=>{const fs=[...u.files];for(let n=0;n<fs.length;n++){const png=fs[n].type==='image/png',b=await shrink(fs[n],png,1600),path='images/learn/photo-'+Date.now().toString(36)+n+(png?'.png':'.jpg');ST[path]=b;URLS[path]=URL.createObjectURL(b);a.push({photo:path,caption:''})}dirty();draw()};
      box.append(field('Upload photos (choose one or several)',u))}};
  draw();return box}
const blank=v=>Array.isArray(v)?[]:v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,blank(x)])):typeof v==='number'?0:typeof v==='boolean'?false:'';
/* ---------- checks + change review ---------- */
function chk(v,p,k,o){
  if(Array.isArray(v))return v.forEach((x,i)=>chk(x,p+' #'+(i+1)+(lab(x)?' ('+lab(x)+')':''),k,o));
  if(v&&typeof v==='object'){['name','title','image'].forEach(r=>{if(r in v&&!String(v[r]).trim())o.push(p+': "'+nice(r)+'" is empty')});
    if(v.start&&v.end&&Date.parse(v.start)>Date.parse(v.end))o.push(p+': ends before it starts');if(v.opens&&v.closes&&Date.parse(v.opens)>=Date.parse(v.closes))o.push(p+': voting closes before it opens');if(v.show===true&&'text' in v&&'linkUrl' in v&&!v.text.trim())o.push(p+': the notice bar is on but has no text');return Object.keys(v).forEach(x=>chk(v[x],p,x,o))}
  if(typeof v==='string'&&v.trim()){if(URLK(k)&&!/^(https?:\/\/|#|\/|mailto:|tel:)/.test(v.trim()))o.push(p+': "'+nice(k)+'" is not a valid link');
    if(/^(start|end|EVENT_DATE|opens|closes)$/.test(k)&&isNaN(Date.parse(v)))o.push(p+': "'+nice(k)+'" is not a valid date');
    if(k==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()))o.push(p+': "Email" is not a valid email address')}}
function diff(a,b,p,o){
  if(JSON.stringify(a)===JSON.stringify(b))return;const sh=s=>{s=typeof s==='string'?s:JSON.stringify(s);return s==null?'(none)':s.length>50?s.slice(0,47)+'…':s};
  if(Array.isArray(a)&&Array.isArray(b)){for(let i=0;i<Math.max(a.length,b.length);i++){const q=p+'['+(lab(b[i])||lab(a[i])||i+1)+']';
    if(i>=a.length)o.push('+ '+q+' added');else if(i>=b.length)o.push('− '+q+' removed: '+(lab(a[i])||''));else diff(a[i],b[i],q,o)}}
  else if(a&&b&&typeof a==='object'&&typeof b==='object')[...new Set([...Object.keys(a),...Object.keys(b)])].forEach(k=>diff(a[k],b[k],p+'.'+k,o));
  else o.push('~ '+p+': '+sh(a)+' → '+sh(b))}
/* ---------- GitHub (same saved settings as the album builder) ---------- */
const gql=async(q,v)=>{const r=await fetch('https://api.github.com/graphql',{method:'POST',headers:{Authorization:'Bearer '+GH.token,'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:v})});
  const j=await r.json().catch(()=>({}));if(!r.ok||j.errors)throw Error((j.errors&&j.errors[0].message)||j.message||('GitHub said '+r.status));return j.data};
function normRepo(s){s=String(s||'').trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\.git$/i,'').replace(/^\/+|\/+$/g,'');return s.split('/').slice(0,2).join('/')}
async function head(){const[o,n]=normRepo(GH.repo).split('/'),b=GH.branch||'main';if(!o||!n)throw Error('Repository must look like owner/name, for example sscpc/sscpc-site. Check the GitHub box.');
  const d=(await gql('query($o:String!,$n:String!,$q:String!,$e:String!){repository(owner:$o,name:$n){ref(qualifiedName:$q){target{oid}} object(expression:$e){...on Blob{text isTruncated}}}}',{o,n,q:'refs/heads/'+b,e:b+':js/data.js'})).repository;
  if(!d||!d.ref)throw Error('Repository or branch not found');if(!d.object||d.object.isTruncated)throw Error('Could not read js/data.js');return{oid:d.ref.target.oid,text:d.object.text}}
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(b)});
function merge(rd){ // per-section 3-way merge: base (when loaded) / ours / theirs (GitHub now)
  const out={};[...new Set([...KEYS,...Object.keys(rd)])].forEach(k=>{const o=JSON.stringify(D[k]),r=JSON.stringify(rd[k])??'null';
    if(o===B[k]||o===r)out[k]=rd[k];else if(r===B[k])out[k]=D[k];
    else throw Error('"'+k+'" was changed on GitHub (maybe by the Album Builder) and also here. Reload the admin and redo your '+k+' changes.')});return out}
